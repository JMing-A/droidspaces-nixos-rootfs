name: 构建 NixOS rootfs

# 仅手动触发：推送和定时都不会跑构建。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "要构建的变体。下拉选择；选“全部变体”就一次构建 variants.json 里的每一条"
        required: true
        default: "全部变体"
        type: choice
        options:
          - "全部变体"
          - "minimal 最小镜像"
          - "minimal-tools 最小镜像 + 常用工具"
      system:
        description: "要构建的架构。下拉选择；不确应选“全部架构”，手机选 aarch64"
        required: true
        default: "全部架构"
        type: choice
        options:
          - "全部架构"
          - "aarch64-linux（手机 / ARM）"
          - "x86_64-linux（电脑 / 模拟器，默认不构建）"
      include_experimental:
        description: "是否连 experimental: true 的变体一起构建。不确定就保持 true"
        required: true
        default: true
        type: boolean
      tag:
        description: "Release 标签（可空）。留空自动用 UTC 时间 vYYYYMMDD-HHMMSS"
        required: false
        default: ""
        type: string
      flake_repo:
        description: "高级：改用其他 flake（如 github:owner/repo）。留空用本仓库当前 commit"
        required: false
        default: ""
        type: string
      flake_ref:
        description: "高级：flake_repo 内的分支或标签。留空用默认分支"
        required: false
        default: ""
        type: string

concurrency:
  group: build-nixos-rootfs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build_date: ${{ steps.plan.outputs.build_date }}
      flake_base: ${{ steps.plan.outputs.flake_base }}
      matrix: ${{ steps.plan.outputs.matrix }}
      matrix_aarch64: ${{ steps.plan.outputs.matrix_ubuntu_24_04_arm }}
      matrix_x86_64: ${{ steps.plan.outputs.matrix_ubuntu_latest }}
      has_aarch64: ${{ steps.plan.outputs.has_aarch64 }}
      has_x86_64: ${{ steps.plan.outputs.has_x86_64 }}
      job_count: ${{ steps.plan.outputs.job_count }}
      variant_count: ${{ steps.plan.outputs.variant_count }}
      system_count: ${{ steps.plan.outputs.system_count }}
    steps:
      - uses: actions/checkout@v5

      - name: Lint the variant and system tables
        run: python3 scripts/gen_rootfs_json.py --lint

      - name: Resolve tag and build matrix
        id: plan
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
          INPUT_SYSTEM: ${{ inputs.system }}
          INPUT_INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FLAKE_REPO: ${{ inputs.flake_repo }}
          INPUT_FLAKE_REF: ${{ inputs.flake_ref }}
        run: |
          # GITHUB_REPOSITORY / GITHUB_SHA are what plan_build.py falls back to
          # when flake_repo is empty: the flake under test is this repository.
          python3 scripts/plan_build.py \
            --variant "$INPUT_VARIANT" \
            --system "$INPUT_SYSTEM" \
            --include-experimental "$INPUT_INCLUDE_EXPERIMENTAL" \
            --tag "$INPUT_TAG" \
            --flake-repo "$INPUT_FLAKE_REPO" \
            --flake-ref "$INPUT_FLAKE_REF" \
            --output "$GITHUB_OUTPUT"

      # The release must exist before the build matrix starts uploading into
      # it. Creating it here also gives the build jobs a single destination
      # instead of an artifact round trip.
      - name: Create the release early
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          python3 scripts/make_release.py --tag "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Summary
        run: |
          {
            echo "### Plan"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.plan.outputs.tag }}\` |"
            echo "| flake | \`${{ steps.plan.outputs.flake_base }}\` |"
            echo "| variants | ${{ steps.plan.outputs.variant_count }} |"
            echo "| systems | ${{ steps.plan.outputs.system_count }} |"
            echo "| build jobs | ${{ steps.plan.outputs.job_count }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.system }} / ${{ matrix.variant_id }}
    needs: plan
    # runs-on is a literal per job. It cannot be ${{ matrix.runner }} when the
    # matrix comes from needs.plan.outputs.matrix: GitHub resolves runs-on
    # while building the job graph, before any job output exists, and the run
    # dies with startup_failure before a single job is scheduled.
    #
    # aarch64 needs an ARM runner and x86_64 needs an x86 one, so the two
    # architectures live in separate jobs. The plan job still decides which
    # variants and whether each job runs at all.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    # Skip entirely when the plan produced no aarch64 entries.
    if: ${{ needs.plan.outputs.has_aarch64 == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_aarch64) }}
    steps:
      - uses: actions/checkout@v5

      # Determinate Nix gives us flakes plus a warm /nix store out of the box.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Actions cache on the store keeps repeat builds short; without it every
      # run re-downloads the whole closure.
      - name: Restore the Nix store from the Actions cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ matrix.system }}-${{ matrix.variant_id }}-${{ hashFiles('systems.json', 'variants.json') }}
          restore-prefixes-first-match: |
            nix-${{ matrix.system }}-${{ matrix.variant_id }}-
            nix-${{ matrix.system }}-

      - name: Build the rootfs tarball
        env:
          FLAKE_BASE: ${{ needs.plan.outputs.flake_base }}
          ATTR_PATH: ${{ matrix.attr_path }}
        run: |
          set -euo pipefail
          echo "flake: ${FLAKE_BASE}#${ATTR_PATH}"
          nix build \
            --extra-experimental-features 'nix-command flakes' \
            --accept-flake-config \
            --no-write-lock-file \
            --keep-going \
            --print-build-logs \
            --out-link ./result \
            "${FLAKE_BASE}#${ATTR_PATH}"
          echo "--- result ---"
          ls -ld ./result
          echo "store path: $(readlink -f ./result)"

      - name: Collect and rename the tarball
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          BUILD_DATE: ${{ needs.plan.outputs.build_date }}
          FILE: ${{ matrix.file }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # `nix build --out-link ./result` leaves a symlink pointing into
          # /nix/store, and plain `find ./result -type f` does NOT descend into a
          # symlink given as its starting point, so the tarball is invisible.
          # -L makes find follow it. Both the real files and the symlinks are
          # printed on failure so a wrong attr_path is easy to diagnose.
          mapfile -t found < <(find -L ./result -maxdepth 3 -type f -name '*.tar.xz' -print | sort)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "expected exactly one .tar.xz under ./result, found ${#found[@]}" >&2
            echo "--- find -L ./result -maxdepth 3 ---" >&2
            find -L ./result -maxdepth 3 -print >&2 || true
            exit 1
          fi

          source_path="${found[0]}"
          case "$source_path" in
            ./result/tarball/*.tar.xz|result/tarball/*.tar.xz) ;;
            *)
              echo "tarball is not under result/tarball: $source_path" >&2
              echo "--- find -L ./result -maxdepth 3 ---" >&2
              find -L ./result -maxdepth 3 -print >&2 || true
              exit 1
              ;;
          esac

          target="dist/${FILE}-Droidspaces-rootfs-${ARCH}-${BUILD_DATE}-${TAG}.tar.xz"
          # Copy, never move: the source lives in the Nix store and moving it
          # would corrupt the store for every later step of the job.
          cp -L "$source_path" "$target"
          chmod 0644 "$target"
          echo "--- ${target} ---"
          ls -lh "$target"
          sha256sum "$target" | tee "dist/SHA256SUMS-${ARCH}-${FILE}.txt"

      # Upload straight to the release instead of staging an artifact first.
      # The old flow moved the same ~200 MiB twice (artifact upload, then
      # artifact download in the release job, then release upload), which was
      # the slowest part of the run. Now the tarball is transferred once.
      #
      # The release must exist before the parallel build jobs finish, so the
      # plan job creates an empty one up front. --clobber makes a rerun of the
      # same tag replace assets rather than fail.
      - name: Upload the tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.xz dist/SHA256SUMS-*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing to upload" >&2
            exit 1
          fi
          gh release upload "$TAG" --clobber "${files[@]}"

  build-x86:
    name: ${{ matrix.system }} / ${{ matrix.variant_id }}
    needs: plan
    # See the note on `build`: runs-on cannot depend on a runtime matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # x86_64 is disabled by default in systems.json, so this job is usually
    # skipped rather than cancelled.
    if: ${{ needs.plan.outputs.has_x86_64 == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_x86_64) }}
    steps:
      - uses: actions/checkout@v5

      # Determinate Nix gives us flakes plus a warm /nix store out of the box.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Actions cache on the store keeps repeat builds short; without it every
      # run re-downloads the whole closure.
      - name: Restore the Nix store from the Actions cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ matrix.system }}-${{ matrix.variant_id }}-${{ hashFiles('systems.json', 'variants.json') }}
          restore-prefixes-first-match: |
            nix-${{ matrix.system }}-${{ matrix.variant_id }}-
            nix-${{ matrix.system }}-

      - name: Build the rootfs tarball
        env:
          FLAKE_BASE: ${{ needs.plan.outputs.flake_base }}
          ATTR_PATH: ${{ matrix.attr_path }}
        run: |
          set -euo pipefail
          echo "flake: ${FLAKE_BASE}#${ATTR_PATH}"
          nix build \
            --extra-experimental-features 'nix-command flakes' \
            --accept-flake-config \
            --no-write-lock-file \
            --keep-going \
            --print-build-logs \
            --out-link ./result \
            "${FLAKE_BASE}#${ATTR_PATH}"
          echo "--- result ---"
          ls -ld ./result
          echo "store path: $(readlink -f ./result)"

      - name: Collect and rename the tarball
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          BUILD_DATE: ${{ needs.plan.outputs.build_date }}
          FILE: ${{ matrix.file }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # `nix build --out-link ./result` leaves a symlink pointing into
          # /nix/store, and plain `find ./result -type f` does NOT descend into a
          # symlink given as its starting point, so the tarball is invisible.
          # -L makes find follow it. Both the real files and the symlinks are
          # printed on failure so a wrong attr_path is easy to diagnose.
          mapfile -t found < <(find -L ./result -maxdepth 3 -type f -name '*.tar.xz' -print | sort)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "expected exactly one .tar.xz under ./result, found ${#found[@]}" >&2
            echo "--- find -L ./result -maxdepth 3 ---" >&2
            find -L ./result -maxdepth 3 -print >&2 || true
            exit 1
          fi

          source_path="${found[0]}"
          case "$source_path" in
            ./result/tarball/*.tar.xz|result/tarball/*.tar.xz) ;;
            *)
              echo "tarball is not under result/tarball: $source_path" >&2
              echo "--- find -L ./result -maxdepth 3 ---" >&2
              find -L ./result -maxdepth 3 -print >&2 || true
              exit 1
              ;;
          esac

          target="dist/${FILE}-Droidspaces-rootfs-${ARCH}-${BUILD_DATE}-${TAG}.tar.xz"
          # Copy, never move: the source lives in the Nix store and moving it
          # would corrupt the store for every later step of the job.
          cp -L "$source_path" "$target"
          chmod 0644 "$target"
          echo "--- ${target} ---"
          ls -lh "$target"
          sha256sum "$target" | tee "dist/SHA256SUMS-${ARCH}-${FILE}.txt"

      # Upload straight to the release instead of staging an artifact first.
      # The old flow moved the same ~200 MiB twice (artifact upload, then
      # artifact download in the release job, then release upload), which was
      # the slowest part of the run. Now the tarball is transferred once.
      #
      # The release must exist before the parallel build jobs finish, so the
      # plan job creates an empty one up front. --clobber makes a rerun of the
      # same tag replace assets rather than fail.
      - name: Upload the tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.xz dist/SHA256SUMS-*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing to upload" >&2
            exit 1
          fi
          gh release upload "$TAG" --clobber "${files[@]}"

  release:
    name: Release
    needs: [plan, build, build-x86]
    # Publishing is not optional once the builds pass, but a *skipped* build
    # job (x86_64 disabled) must not count as failure. A plain `needs` list
    # would treat skip as not-success and drop the release, so assert the two
    # real outcomes instead: nothing failed, and the aarch64 build ran.
    if: >-
      ${{ always()
          && needs.plan.result == 'success'
          && needs.build.result == 'success'
          && (needs.build-x86.result == 'success' || needs.build-x86.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate rootfs.json
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          BUILD_DATE: ${{ needs.plan.outputs.build_date }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The build jobs uploaded their tarballs directly to the release, so
          # there is nothing in dist/. Read the asset list back from the API
          # instead of re-downloading ~400 MiB just to hash it.
          python3 scripts/gen_rootfs_json.py \
            --out rootfs.json \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --build-date "$BUILD_DATE" \
            --allow-partial

      - name: Finalise the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          FLAKE_BASE: ${{ needs.plan.outputs.flake_base }}
          FLAKE_REF: ${{ inputs.flake_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Assets are already on the release; this step only replaces the
          # placeholder body written by the plan job with the final summary.
          python3 scripts/write_notes.py \
            --flake "$FLAKE_BASE" \
            --ref "$FLAKE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" \
            --rootfs-json rootfs.json \
            --out notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --latest

      - name: Commit the regenerated rootfs.json
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootfs.json
          if git diff --cached --quiet; then
            echo "rootfs.json unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: update rootfs.json for release $TAG"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              exit 0
            fi
            echo "push attempt $attempt failed, rebasing" >&2
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
          done
          echo "could not push rootfs.json after 3 attempts" >&2
          exit 1
